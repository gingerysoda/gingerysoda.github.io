<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perk</title>
<style>
  :root { --bg: #fbfbfa; --text: #1d1d1f; --muted: #6e6e73; --accent: #3a6ff7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --text: #f2f2f4; --muted: #9a9aa0; --accent: #7b9cff; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 80px 20px; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Perk</h1>
  <p>Perk is a personal, native Mac email app for Gmail. It is built for and used by one person and is not distributed to the public.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
